name: Redirect legacy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .github/legacy-pages

      - name: Deploy redirects
        id: deployment
        uses: actions/deploy-pages@v5
