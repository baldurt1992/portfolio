<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>BaldurDev OG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #05050a;
        color: #f0f1f5;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #05050a;
        isolation: isolate;
      }

      .blob-primary {
        position: absolute;
        width: 720px;
        height: 520px;
        left: -180px;
        top: -160px;
        background: radial-gradient(
          ellipse at center,
          rgba(59, 130, 246, 0.22) 0%,
          transparent 68%
        );
        pointer-events: none;
      }

      .blob-accent {
        position: absolute;
        width: 680px;
        height: 500px;
        right: -140px;
        bottom: -180px;
        background: radial-gradient(ellipse at center, rgba(251, 146, 60, 0.2) 0%, transparent 70%);
        pointer-events: none;
      }

      .inner {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 48px;
        height: 100%;
        padding: 72px 80px 64px;
      }

      .brand {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #f0f1f5;
      }

      .title {
        margin-top: 28px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 68px;
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.035em;
      }

      .tagline {
        margin-top: 28px;
        max-width: 28ch;
        font-family: Inter, sans-serif;
        font-size: 22px;
        font-weight: 400;
        line-height: 1.4;
        color: #c9ced8;
      }

      .meta {
        position: absolute;
        left: 80px;
        bottom: 64px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 520px;
      }

      .rule {
        position: relative;
        height: 1px;
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
      }

      .rule span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        background: #fb923c;
      }

      .location {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #fb923c;
      }

      .right {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-top: 24px;
      }

      .lead {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #9aa3b2;
      }

      .tokens {
        margin-top: 16px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.03em;
        color: #fb923c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="blob-primary"></div>
      <div class="blob-accent"></div>
      <div class="inner">
        <div>
          <p class="brand">BaldurDev</p>
          <h1 class="title">Full Stack<br />Software Engineer</h1>
          <p class="tagline">Productos web que funcionan, escalan y venden.</p>
        </div>
        <div class="right">
          <p class="lead">Diseño y construyo</p>
          <p class="tokens">
            SaaS<br />
            ERP<br />
            APIs<br />
            Landing pages<br />
            Automatizaciones<br />
            Sitios a medida
          </p>
        </div>
      </div>
      <div class="meta">
        <div class="rule" aria-hidden="true"><span></span></div>
        <p class="location">Colombia · Remoto</p>
      </div>
    </div>
  </body>
</html>
